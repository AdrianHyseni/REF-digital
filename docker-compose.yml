services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: refnetwork
      POSTGRES_PASSWORD: refnetwork
      POSTGRES_DB: refnetwork
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refnetwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://refnetwork:refnetwork@postgres:5432/refnetwork?schema=public
      PORT: 4000
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # Set to "true" to seed demo data on every fresh container start.
      # Leave "false" once you have real data you don't want reset — run
      # `docker compose exec api npm run seed` for a one-off (re)seed instead.
      SEED_ON_START: "true"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_ADMIN_URL: http://localhost:5174
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  postgres-data:
